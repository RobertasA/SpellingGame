<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gem Fairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5b4a6e;
    --ink-soft: #8d7ba3;
    --card: rgba(255, 252, 255, .92);
    --pink: #ff8fc8;
    --pink-deep: #f06aae;
    --mint: #7fe0b0;
    --sky: #a8dcff;
    --gold: #ffcf4a;
    --shadow: 0 8px 0 rgba(120, 80, 150, .18), 0 14px 30px rgba(120, 80, 150, .18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Fredoka", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    color: var(--ink);
    background: #f3eefc;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 20;
  }
  .overlay.active { display: flex; }
  .overlay.dim { background: rgba(243, 230, 255, .35); backdrop-filter: blur(2px); }
  .card {
    background: var(--card);
    border-radius: 32px;
    padding: 28px 32px;
    box-shadow: var(--shadow);
    text-align: center;
    max-width: 560px; width: 100%;
    max-height: calc(100vh - 32px); overflow: auto;
    animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 {
    font-size: clamp(42px, 9vw, 72px); line-height: 1;
    color: var(--pink-deep);
    text-shadow: 0 4px 0 #ffd6ec;
    letter-spacing: 1px;
  }
  h2 { font-size: 34px; color: var(--pink-deep); margin-bottom: 8px; }
  .sub { font-size: 19px; color: var(--ink-soft); margin: 10px 0 22px; }
  .btn-col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  button {
    font: inherit; cursor: pointer; border: 0;
    color: #fff; background: var(--pink);
    font-size: 22px; font-weight: 600;
    padding: 12px 28px; border-radius: 999px;
    box-shadow: 0 5px 0 var(--pink-deep);
    transition: transform .1s, box-shadow .1s, filter .15s;
  }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
  button.big { font-size: 28px; padding: 14px 44px; }
  button.mint { background: var(--mint); box-shadow: 0 5px 0 #4fc28e; }
  button.sky { background: #7cc6ff; box-shadow: 0 5px 0 #4b9fe0; }
  button.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #e1d4ef; }
  button:disabled { filter: grayscale(.8) opacity(.5); cursor: default; transform: none; }

  /* level picker */
  .level-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    margin: 18px 0 6px;
  }
  .level-grid button {
    padding: 8px 0 6px; font-size: 24px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .level-grid .stars { font-size: 12px; letter-spacing: 1px; min-height: 15px; }
  .level-grid button.locked { background: #d9cfe6; box-shadow: 0 5px 0 #c2b5d4; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    display: none; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; gap: 10px; z-index: 10; pointer-events: none;
  }
  #hud.active { display: flex; }
  .hud-left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill {
    background: var(--card); border-radius: 999px;
    padding: 6px 16px; font-size: 19px; font-weight: 600;
    box-shadow: 0 4px 0 rgba(120, 80, 150, .15);
    display: flex; align-items: center; gap: 6px;
  }
  #bag { padding: 6px 12px; }
  #bag .slot {
    width: 24px; height: 24px; border-radius: 50%;
    background: #efe6f7; display: grid; place-items: center;
  }
  #bag .slot svg { width: 22px; height: 22px; animation: pop .4s cubic-bezier(.2, 1.8, .4, 1); }
  #challengePill.done { background: #dbffe9; }
  .hud-right { display: flex; gap: 8px; pointer-events: auto; }
  .icon-btn {
    width: 48px; height: 48px; padding: 0; font-size: 22px;
    background: var(--card); color: var(--ink);
    box-shadow: 0 4px 0 rgba(120, 80, 150, .18);
  }
  .icon-btn.off { opacity: .55; }
  #crewBar .hud-right, #crewTitle { pointer-events: auto; }

  /* ---------- word labels floating over gems ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .label {
    position: absolute; left: 0; top: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    will-change: transform;
    transition: opacity .3s;
  }
  .word {
    background: rgba(255, 255, 255, .9);
    border-radius: 18px;
    padding: 2px 14px 4px;
    font-size: clamp(26px, 3.4vw, 38px); font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink);
    box-shadow: 0 4px 0 rgba(120, 80, 150, .15);
    white-space: nowrap;
    transition: transform .15s;
  }
  .word span.done { color: var(--pink-deep); }
  .word span.next { text-decoration: underline 3px var(--gold); text-underline-offset: 5px; }
  .label.target .word {
    transform: scale(1.12);
    box-shadow: 0 0 0 4px var(--gold), 0 6px 0 rgba(120, 80, 150, .2);
  }
  .label.wiggle .word { animation: wiggle .35s; }
  @keyframes wiggle {
    0%, 100% { translate: 0; } 20% { translate: -7px; } 40% { translate: 6px; }
    60% { translate: -4px; } 80% { translate: 3px; }
  }
  .timer { width: 64px; height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .7); overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--mint); border-radius: 8px; transform-origin: left; }
  .crew-label {
    background: var(--card); border-radius: 14px; padding: 3px 12px;
    font-size: 18px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 3px 0 rgba(120, 80, 150, .15);
  }
  .crew-label.unknown { color: var(--ink-soft); }

  /* ---------- toast, hint, crew bar ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 18%;
    transform: translate(-50%, 30px) scale(.8); opacity: 0;
    background: var(--card); border-radius: 24px; padding: 12px 24px;
    font-size: 24px; font-weight: 600; box-shadow: var(--shadow);
    transition: all .35s cubic-bezier(.2, 1.6, .4, 1);
    z-index: 15; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #hint {
    position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%);
    font-size: 22px; font-weight: 600; color: #fff;
    background: rgba(140, 100, 180, .55); padding: 8px 20px; border-radius: 999px;
    z-index: 6; pointer-events: none; opacity: 0; transition: opacity .5s;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #crewBar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    display: none; justify-content: space-between; align-items: center; padding: 14px 16px;
  }
  #crewBar.active { display: flex; }
  #crewTitle { font-size: 26px; padding: 8px 22px; }

  /* complete screen */
  .big-stars { font-size: 54px; letter-spacing: 6px; margin: 4px 0 10px; }
  .big-stars .dim { filter: grayscale(1) opacity(.3); }
  .stats { font-size: 20px; line-height: 1.7; }
  .friends { font-size: 20px; margin-top: 10px; }
  .friends .emo { font-size: 36px; display: inline-block; animation: hop .6s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-6px); } }

  /* on-screen keyboard for tablets */
  #kbd {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
    display: none; flex-direction: column; gap: 6px; padding: 8px 6px 12px;
    background: rgba(255, 250, 255, .75); backdrop-filter: blur(4px);
  }
  #kbd.active { display: flex; }
  #kbd .row { display: flex; justify-content: center; gap: 6px; }
  #kbd button {
    flex: 0 1 56px; height: 52px; padding: 0; font-size: 26px; border-radius: 14px;
    background: #fff; color: var(--ink); box-shadow: 0 4px 0 #e1d4ef;
  }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 28px; color: var(--ink-soft); z-index: 30; background: #f3eefc;
    text-align: center; padding: 16px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="loading">✨ Waking up the fairy… ✨</div>

<!-- title -->
<div class="overlay active" id="titleScreen">
  <div class="card">
    <h1>Gem Fairy</h1>
    <p class="sub">Spell the words to catch the sparkly gems! ✨</p>
    <div class="btn-col">
      <button class="big" id="playBtn">Play</button>
      <div class="btn-row" style="margin-top:4px">
        <button class="sky" id="levelsBtn">Levels</button>
        <button class="mint" id="crewBtn">My Crew</button>
      </div>
    </div>
  </div>
</div>

<!-- level picker -->
<div class="overlay" id="levelScreen">
  <div class="card">
    <h2>Pick a level</h2>
    <div class="level-grid" id="levelGrid"></div>
    <div class="btn-row"><button class="ghost" id="levelsBackBtn">Back</button></div>
  </div>
</div>

<!-- crew viewer (the animals themselves are drawn in 3D) -->
<div id="crewBar">
  <div class="pill" id="crewTitle">My Crew</div>
  <div class="hud-right"><button class="ghost" id="crewBackBtn">Back</button></div>
</div>

<!-- in-game HUD -->
<div id="hud">
  <div class="hud-left">
    <div class="pill" id="levelPill">Level 1</div>
    <div class="pill" id="bag"></div>
    <div class="pill" id="challengePill"></div>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="voiceBtn" title="Say the words out loud">🗣️</button>
    <button class="icon-btn" id="muteBtn" title="Sound">🔊</button>
    <button class="icon-btn" id="pauseBtn" title="Pause">⏸️</button>
  </div>
</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="kbd"></div>

<!-- pause -->
<div class="overlay dim" id="pauseScreen">
  <div class="card">
    <h2>Taking a little rest 🌙</h2>
    <p class="sub">The gems will wait for you.</p>
    <div class="btn-row">
      <button class="big mint" id="resumeBtn">Keep going</button>
      <button class="ghost" id="quitBtn">Menu</button>
    </div>
  </div>
</div>

<!-- level complete -->
<div class="overlay dim" id="completeScreen">
  <div class="card">
    <h2 id="completeTitle">Bag full!</h2>
    <div class="big-stars" id="completeStars"></div>
    <div class="stats" id="completeStats"></div>
    <div class="friends" id="completeFriends"></div>
    <div class="btn-row">
      <button class="big" id="nextBtn">Next level</button>
      <button class="sky" id="replayBtn">Again</button>
      <button class="ghost" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<script>
  // If the 3D library can't load (e.g. offline), say so instead of a blank page.
  setTimeout(function () {
    if (!window.__gemFairyReady) {
      document.getElementById("loading").textContent =
        "The fairy couldn't fly in 😢 — this game needs an internet connection the first time.";
    }
  }, 10000);
</script>

<script type="module">
import * as THREE from "three";

/* ============================== config ============================== */

// Each level adds a few new sounds, following a phonics order (SATPIN first).
const WORDS = [
  ["at","it","in","an","is","as","sat","sit","pin","tap","sip","pat","nap","tip","tin","pan"],
  ["sat","pin","tap","sip","tip","pat","tan","nap","pit","pan","nip","tin","sap","ant","pip","spin"],
  ["mat","map","man","mad","dad","dip","did","sad","and","pad","mid","dim","tad","sand","mist","damp"],
  ["dog","got","cot","cat","cap","can","kit","kid","pig","dig","top","pot","on","not","gap","tag"],
  ["red","ten","pet","net","run","sun","cup","rug","nut","rat","duck","sock","kick","neck","pen","tuck"],
  ["hat","hen","hop","bed","bus","bat","fan","fig","log","leg","lip","bag","hug","fun","hut","bun"],
  ["huff","puff","bell","doll","hill","kiss","jam","jet","van","vet","web","wig","box","six","fox","wax"],
  ["yes","yap","zip","buzz","quiz","quack","chin","chip","chop","ship","shop","fish","dish","this","moth","bath"],
  ["ring","king","sing","song","long","bang","wing","pink","sink","bunk","wink","think","thing","shell","chick","rich"],
  ["frog","crab","stop","swim","flag","drum","trip","clap","plum","snap","grin","slug","spot","step","sled","skip"],
  ["jump","milk","hand","tent","pond","desk","lamp","nest","help","belt","gift","wind","fist","mask","golf","pump"],
  ["rain","tail","snail","bee","tree","feet","sheep","night","light","high","boat","coat","goat","road","soap","seed"],
  ["moon","zoo","book","look","star","farm","car","fork","corn","horn","burn","fur","cow","owl","coin","oil"],
  ["hammer","letter","ear","hear","near","fair","hair","pair","cloud","out","mouth","boy","toy","joy","sure","summer"],
  ["cake","game","lake","bike","kite","time","home","bone","rope","cube","tune","slide","smile","snake","stone","plane"],
  ["the","said","they","was","you","have","come","some","were","there","little","one","what","where","love","friend"],
  ["rabbit","kitten","garden","picnic","sunset","basket","pencil","button","muffin","puppet","carpet","rocket","dragon","magnet","jacket","window"],
  ["flower","forest","river","meadow","berry","acorn","petal","leaf","branch","puddle","rainbow","honey","pebble","breeze","blossom","clover"],
  ["fairy","magic","wand","crystal","castle","sparkle","unicorn","wings","glitter","treasure","moonlight","firefly","twinkle","dragonfly","potion","starlight"],
  ["beautiful","adventure","butterfly","chocolate","elephant","umbrella","princess","snowflake","strawberry","sunflower","kangaroo","dinosaur","hedgehog","squirrel","mushroom","pumpkin"],
];
// seconds a gem stays out before the fairy flies past it (longer words get a bit more)
const LIFE      = [26, 22, 20, 20, 19, 18, 18, 17, 17, 16, 16, 16, 15, 16, 15, 15, 17, 17, 18, 19];
const ON_SCREEN = [ 1,  1,  1,  2,  2,  2,  2,  2,  2,  2,  2,  3,  3,  2,  2,  3,  2,  2,  2,  2];
const CHALLENGES = {
  3: { color: "green", count: 3 },  5: { color: "pink", count: 4 },
  7: { color: "blue", count: 4 },   9: { color: "gold", count: 4 },
  11: { color: "purple", count: 4 }, 13: { color: "green", count: 5 },
  15: { color: "pink", count: 5 },  17: { color: "blue", count: 5 },
  19: { color: "gold", count: 5 },  20: { color: "purple", count: 5 },
};
const LEVELS = WORDS.map((words, i) => ({
  words,
  life: LIFE[i],
  maxOnScreen: ON_SCREEN[i],
  bagSize: i < 2 ? 8 : 10,
  challenge: CHALLENGES[i + 1] || null,
}));

const GEMS = {
  pink:   { hex: 0xff8fc8, css: "#ff8fc8", emoji: "💗" },
  blue:   { hex: 0x6fc8ff, css: "#6fc8ff", emoji: "💙" },
  gold:   { hex: 0xffc93c, css: "#ffc93c", emoji: "💛" },
  green:  { hex: 0x5fdc96, css: "#5fdc96", emoji: "💚" },
  purple: { hex: 0xb48cff, css: "#b48cff", emoji: "💜" },
};
const GEM_COLORS = Object.keys(GEMS);

const ANIMALS = {
  bunny:    { name: "Bunny",    emoji: "🐰" },
  bear:     { name: "Bear",     emoji: "🐻" },
  panda:    { name: "Panda",    emoji: "🐼" },
  frog:     { name: "Frog",     emoji: "🐸" },
  duck:     { name: "Duckling", emoji: "🐥" },
  owl:      { name: "Owl",      emoji: "🦉" },
  fox:      { name: "Fox",      emoji: "🦊" },
  hedgehog: { name: "Hedgehog", emoji: "🦔" },
};
const ANIMAL_KINDS = Object.keys(ANIMALS);
const REWARD_CHANCE = 0.18;

// world layout: the forest scrolls right-to-left past the fairy
const FAIRY_X = -4.6;
const REVEAL_X = 8.2;    // gems pop out of their hiding spots here...
const SPAWN_X = REVEAL_X + 0.9;   // ...just after the spot sprouts in at the right edge
const MISS_X = FAIRY_X + 0.7;
const LANES = [1.1, -1.1, -3.1];
const WORLD_HALF = 30;

/* ============================ persistence ============================ */

const SAVE_KEY = "gemFairy3d";
function loadSave() {
  const fresh = { unlocked: 1, stars: {}, crew: {}, totalGems: 0, muted: false, speak: true };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === "object") return { ...fresh, ...s };
  } catch (e) { /* no storage or corrupted — start fresh */ }
  return fresh;
}
const save = loadSave();
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ }
}

/* =============================== audio ============================== */
/* Music: "Cozy Puzzle In-Game 1" by Samza (CC0); SFX: Kenney (CC0) — see CREDITS.md */

const music = new Audio("assets/audio/music.mp3");
music.loop = true;
music.volume = 0.3;
let musicStarted = false;
function playMusic() {
  const p = music.play();
  if (p) p.then(() => { musicStarted = true; }).catch(() => { /* blocked until a gesture */ });
}
function startMusic() { if (!musicStarted && !save.muted) playMusic(); }

const sfx = {};
for (const [name, vol] of Object.entries({ key: .45, wrong: .4, collect: .7, reward: .8, complete: .8 })) {
  const base = new Audio(`assets/audio/${name}.ogg`);
  base.preload = "auto";
  sfx[name] = () => {
    if (save.muted) return;
    const a = base.cloneNode();
    a.volume = vol;
    const p = a.play();
    if (p) p.catch(() => {});
  };
}

function say(text) {
  if (!save.speak || save.muted || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.85;
  u.pitch = 1.3;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ============================ three setup =========================== */

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const FOG_COLOR = 0xf6ecfb;
scene.fog = new THREE.Fog(FOG_COLOR, 26, 70);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const lookTarget = new THREE.Vector3(0, 1.5, -1);

scene.add(new THREE.HemisphereLight(0xfff6ff, 0x9bd68a, 1.6));
const sunLight = new THREE.DirectionalLight(0xfff1dc, 2.2);
sunLight.position.set(5, 12, 8);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -16, right: 16, top: 12, bottom: -12, near: 1, far: 40 });
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

// soft two-colour sky dome
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(120, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x8fd0ff) }, bottom: { value: new THREE.Color(FOG_COLOR) } },
    vertexShader: `varying float h; void main(){ h = normalize(position).y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying float h;
      void main(){ gl_FragColor = vec4(mix(bottom, top, smoothstep(-0.02, 0.45, h)), 1.0); }`,
  })
);
scene.add(sky);

/* toon shading: three flat bands give everything a soft cartoon look */
const gradientMap = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;
const matCache = new Map();
function toon(color) {
  if (!matCache.has(color)) matCache.set(color, new THREE.MeshToonMaterial({ color, gradientMap }));
  return matCache.get(color);
}

const SPHERE = new THREE.SphereGeometry(1, 24, 16);
function ball(color, r, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(SPHERE, toon(color));
  m.scale.set(r * sx, r * sy, r * sz);
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}
function cone(color, r, h, x, y, z, rx = 0, rz = 0, seg = 16) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), toon(color));
  m.position.set(x, y, z);
  m.rotation.set(rx, 0, rz);
  m.castShadow = true;
  return m;
}
function cyl(color, rt, rb, h, x, y, z, seg = 18) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), toon(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  return m;
}
function eye(group, x, y, z, r = 0.055) {
  group.add(ball(0x3a2c3f, r, x, y, z));
  const shine = new THREE.Mesh(SPHERE, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  shine.scale.setScalar(r * 0.38);
  shine.position.set(x + r * 0.35, y + r * 0.4, z + r * 0.75);
  shine.userData.noOutline = true;
  group.add(shine);
}

// inverted-hull outlines make the characters read like a picture book
const OUTLINE = new THREE.MeshBasicMaterial({ color: 0x6b4f78, side: THREE.BackSide });
function outline(group, k = 1.07) {
  const meshes = [];
  group.traverse(o => { if (o.isMesh && !o.userData.noOutline) meshes.push(o); });
  for (const m of meshes) {
    const hull = new THREE.Mesh(m.geometry, OUTLINE);
    hull.scale.setScalar(k);
    hull.userData.noOutline = true;
    m.add(hull);
  }
}

/* canvas textures for sparkles (drawn in code so the page works from disk) */
function canvasTexture(draw, size = 64) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const starTex = canvasTexture((g, s) => {
  const h = s / 2;
  const glow = g.createRadialGradient(h, h, 0, h, h, h);
  glow.addColorStop(0, "rgba(255,255,255,1)");
  glow.addColorStop(0.25, "rgba(255,255,255,.6)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = glow;
  g.fillRect(0, 0, s, s);
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(h, 2); g.quadraticCurveTo(h, h, s - 2, h); g.quadraticCurveTo(h, h, h, s - 2);
  g.quadraticCurveTo(h, h, 2, h); g.quadraticCurveTo(h, h, h, 2);
  g.fill();
});
const dotTex = canvasTexture((g, s) => {
  const h = s / 2;
  const grad = g.createRadialGradient(h, h, 0, h, h, h);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.5, "rgba(255,255,255,.5)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
});
const heartTex = canvasTexture((g, s) => {
  g.fillStyle = "#fff";
  g.beginPath();
  g.moveTo(s / 2, s * 0.85);
  g.bezierCurveTo(-s * 0.1, s * 0.4, s * 0.2, -s * 0.05, s / 2, s * 0.28);
  g.bezierCurveTo(s * 0.8, -s * 0.05, s * 1.1, s * 0.4, s / 2, s * 0.85);
  g.fill();
});

  head.add(ball(cream, 0.24, 0, -0.14, 0.36, 1.1, 0.75, 0.7));     // muzzle
  head.add(ball(dark, 0.07, 0, -0.06, 0.53, 1.2, 0.8, 1));          // nose
  eye(head, -0.19, 0.06, 0.42, 0.075);
  eye(head, 0.19, 0.06, 0.42, 0.075);
  head.add(ball(0xff9fb5, 0.07, -0.32, -0.1, 0.33, 1, 0.7, 0.4));   // blush
  head.add(ball(0xff9fb5, 0.07, 0.32, -0.1, 0.33, 1, 0.7, 0.4));
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.015, 6, 12, Math.PI), toon(dark));
  mouth.rotation.z = Math.PI;
  mouth.position.set(0, -0.2, 0.55);
  head.add(mouth);
  for (const s of [-1, 1]) {
    head.add(cone(fur, 0.17, 0.42, s * 0.3, 0.45, -0.02, 0, -s * 0.35, 12));
    head.add(cone(cream, 0.09, 0.24, s * 0.29, 0.43, 0.06, 0, -s * 0.35, 12));
  }
  // flower crown
  for (let i = 0; i < 5; i++) {
    const a = -0.9 + i * 0.45;
    head.add(ball(pick([0xffffff, 0xffd166, 0xff9ccf]), 0.06, Math.sin(a) * 0.45, 0.36 + Math.cos(a) * 0.05, Math.cos(a) * 0.18));
  }

  // arm + wand
  const arm = new THREE.Group();
  arm.position.set(0.3, 0.3, 0.1);
  body.add(arm);
  arm.add(ball(fur, 0.09, 0.12, 0.02, 0.08, 1.6, 1, 1));
  const stick = cyl(0xffffff, 0.025, 0.025, 0.6, 0.28, 0.25, 0.12, 8);
  stick.rotation.z = -0.5;
  arm.add(stick);
  const starShape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.07 : 0.17, a = (i / 10) * Math.PI * 2 + Math.PI / 2;
    i ? starShape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : starShape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const star = new THREE.Mesh(
    new THREE.ExtrudeGeometry(starShape, { depth: 0.06, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 }),
    new THREE.MeshToonMaterial({ color: 0xffd34d, emissive: 0xffb300, emissiveIntensity: 0.35, gradientMap })
  );
  star.position.set(0.43, 0.53, 0.1);
  star.castShadow = true;
  arm.add(star);
  const wandTip = new THREE.Object3D();
  wandTip.position.copy(star.position);
  arm.add(wandTip);

  outline(root);

  // wings (added after outlining so they stay soft and glassy)
  const wingMat = new THREE.MeshBasicMaterial({ color: 0xe3f4ff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false });
  const wingEdge = new THREE.MeshBasicMaterial({ color: 0xc7b3ff, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.2, 0.8, 1.0, 1.05, 1.0, 0.5);
  shape.bezierCurveTo(1.0, 0.2, 0.55, 0.05, 0, 0);
  shape.bezierCurveTo(0.45, -0.05, 0.75, -0.35, 0.55, -0.55);
  shape.bezierCurveTo(0.35, -0.7, 0.1, -0.35, 0, 0);
  const wingGeo = new THREE.ShapeGeometry(shape, 16);
  const wings = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(s * 0.1, 0.35, -0.3);
    const w = new THREE.Mesh(wingGeo, wingMat);
    const edge = new THREE.Mesh(wingGeo, wingEdge);
    edge.scale.setScalar(1.08);
    edge.position.z = -0.01;
    w.scale.x = edge.scale.x = s;
    edge.scale.x *= 1.08;
    pivot.add(edge, w);
    pivot.userData.side = s;
    body.add(pivot);
    wings.push(pivot);
  }

  root.userData = { body, head, arm, wings, wandTip, star };
  return root;
}

        const dir = new THREE.Vector3(Math.sin(a) * Math.sin(b), Math.cos(b), -Math.abs(Math.cos(a)) * Math.sin(b) - 0.2).normalize();
        const spike = cone(0x9a6b4b, 0.07, 0.24, dir.x * 0.32, 0.55 + dir.y * 0.38, -0.05 + dir.z * 0.32, 0, 0, 6);
        spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        g.add(spike);
      }
      g.add(ball(P.fur, 0.11, 0, 0.76, 0.3, 1, 0.8, 1));
      g.add(ball(dark, 0.04, 0, 0.78, 0.4));
      eyes(0.88, 0.3); cheeks(0.78);
      break;
  }
  if (mystery) {
    const shadowMat = toon(0xb9aed0);
    g.traverse(o => { if (o.isMesh) o.material = shadowMat; });
  }
  outline(g, 1.08);
  g.userData.kind = kind;
  return g;
}

/* ============================ particles ============================= */

const particles = [];
const spritePool = [];
function emit({ pos, vel = new THREE.Vector3(), color = 0xffffff, size = 0.3, life = 0.8, gravity = 0, tex = starTex, drag = 1, spin = 0 }) {
  let s = spritePool.pop();
  if (!s) s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false }));
  s.material.map = tex;
  s.material.color.set(color);
  s.material.opacity = 1;
  s.material.rotation = rand(0, Math.PI);
  s.position.copy(pos);
  s.scale.setScalar(size);
  scene.add(s);
  particles.push({ s, vel: vel.clone(), life, max: life, size, gravity, drag, spin });
}
function burst(pos, colors, n = 18, power = 3) {
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(rand(-1, 1), rand(-0.3, 1.2), rand(-1, 1)).normalize().multiplyScalar(rand(power * 0.4, power));
    emit({ pos, vel: v, color: pick(colors), size: rand(0.25, 0.5), life: rand(0.6, 1.1), gravity: -3, drag: 0.94, spin: rand(-4, 4) });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.s);
      spritePool.push(p.s);
      particles.splice(i, 1);
      continue;
    }
    p.vel.y += p.gravity * dt;
    p.vel.multiplyScalar(Math.pow(p.drag, dt * 60));
    p.s.position.addScaledVector(p.vel, dt);
    p.s.material.rotation += p.spin * dt;
    const k = p.life / p.max;
    p.s.material.opacity = Math.min(1, k * 2);
    p.s.scale.setScalar(p.size * (0.5 + 0.5 * k));
  }
}

/* ============================ hiding spots ========================== */

function hideout(kind) {
  const g = new THREE.Group();
  let height;
  if (kind === "bush") {
    const c = pick([0x78c96a, 0x86d27a]);
    g.add(ball(c, 0.5, -0.35, 0.4, 0));
    g.add(ball(c, 0.6, 0.1, 0.55, 0.05));
    g.add(ball(0x92da82, 0.45, 0.48, 0.38, 0.1));
    for (let i = 0; i < 5; i++) g.add(ball(pick([0xff7a8a, 0xffd36b]), 0.07, rand(-0.6, 0.7), rand(0.4, 0.9), 0.5));
    height = 1.05;
  } else if (kind === "mushroom") {
    const m = mushroom(2.2);
    g.add(m);
    height = 1.15;
  } else if (kind === "stump") {
    g.add(cyl(0xc99a72, 0.45, 0.55, 0.6, 0, 0.3, 0));
    g.add(cyl(0xf2d8b0, 0.45, 0.45, 0.04, 0, 0.61, 0));
    g.add(cyl(0xd9b48a, 0.25, 0.25, 0.045, 0, 0.615, 0));
    g.add(ball(0x86d27a, 0.2, -0.5, 0.12, 0.2));
    height = 0.65;
  } else {
    // a big flower
    g.add(cyl(0x6cbf62, 0.05, 0.06, 0.8, 0, 0.4, 0, 8));
    const leaf = ball(0x7fcf6c, 0.2, 0.18, 0.3, 0, 1, 0.35, 0.6);
    leaf.rotation.z = -0.6;
    g.add(leaf);
    const c = pick([0xff9ccf, 0xb9a3ff, 0xffb36b]);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      g.add(ball(c, 0.2, Math.cos(a) * 0.24, 0.85 + Math.sin(a) * 0.24, 0, 1, 1, 0.4));
    }
    g.add(ball(0xffd166, 0.15, 0, 0.85, 0.05, 1, 1, 0.6));
    height = 1.35;
  }
  g.userData.height = height;
  return g;
}
const HIDEOUT_KINDS = ["bush", "mushroom", "stump", "flower"];

/* ============================= game state =========================== */

let mode = "title";          // title | play | celebrate | crew
let paused = false;
let worldSpeed = 0;
let clock = 0;

const game = {
  levelNum: 1, level: null,
  gems: [],                  // every gem whose hiding spot is still in the world
  target: null,
  pending: [],               // seconds until each queued gem appears
  bag: [],                   // colours in the bag
  collected: 0, missed: 0,
  newFriends: [],
  lastLane: -1,
};

function startLevel(n) {
  clearGems();
  game.levelNum = n;
  game.level = LEVELS[n - 1];
  game.level.speed = (REVEAL_X - MISS_X) / game.level.life;
  game.target = null;
  game.pending = [];
  game.bag = [];
  game.collected = 0;
  game.missed = 0;
  game.newFriends = [];
  for (let i = 0; i < game.level.maxOnScreen; i++) game.pending.push(0.8 + i * Math.min(4, game.level.life * 0.3));
  mode = "play";
  paused = false;
  fairyAnim.celebrate = 0;
  showOverlay(null);
  $("hud").classList.add("active");
  $("crewBar").classList.remove("active");
  $("levelPill").textContent = `Level ${n}`;
  renderBag();
  renderChallenge();
  showKeyboard(true);
  layoutCrew();
  if (n === 1 && save.totalGems === 0) setTimeout(() => hint("Type the letters on a gem to catch it! ✨", 6000), 1500);
}

function clearGems() {
  for (const gem of game.gems) {
    world.remove(gem.root);
    if (gem.mesh.parent) gem.mesh.parent.remove(gem.mesh);
    gem.label.remove();
  }
  game.gems = [];
  game.target = null;
}

function goToMenu() {
  clearGems();
  mode = "title";
  paused = false;
  $("hud").classList.remove("active");
  $("crewBar").classList.remove("active");
  showKeyboard(false);
  clearCrewShowcase();
  layoutCrew();
  showOverlay("titleScreen");
}

/* ------------------------------- gems ------------------------------- */

function liveGems() { return game.gems.filter(g => g.state === "waiting" || g.state === "rising" || g.state === "active"); }

function pickWord() {
  const live = liveGems();
  const inUse = live.map(g => g.word);
  const firsts = live.map(g => g.word[0]);
  const words = game.level.words;
  let pool = words.filter(w => !inUse.includes(w) && !firsts.includes(w[0]));   // distinct first letters
  if (!pool.length) pool = words.filter(w => !inUse.includes(w));
  return pick(pool);
}

function pickColor() {
  const ch = game.level.challenge;
  if (!ch) return pick(GEM_COLORS);
  // make sure there are always enough challenge gems to finish the bag
  const have = game.bag.filter(c => c === ch.color).length;
  const coming = liveGems().filter(g => g.color === ch.color).length;
  const needed = ch.count - have - coming;
  const slotsLeft = game.level.bagSize - game.bag.length - liveGems().length;
  if (needed > 0 && (needed >= slotsLeft || game.bag.length >= game.level.bagSize)) return ch.color;
  return Math.random() < 0.35 ? ch.color : pick(GEM_COLORS);
}

const GEM_GEO = new THREE.OctahedronGeometry(0.42, 0);

function spawnGem() {
  const word = pickWord();
  const color = pickColor();
  let lane;
  do { lane = Math.floor(Math.random() * LANES.length); } while (lane === game.lastLane && LANES.length > 1);
  game.lastLane = lane;

  const root = new THREE.Group();
  root.position.set(SPAWN_X, 0, LANES[lane]);
  const spot = hideout(pick(HIDEOUT_KINDS));
  spot.rotation.y = rand(-0.3, 0.3);
  spot.scale.setScalar(0.01);
  spot.userData.grow = 0;
  root.add(spot);

  const mat = new THREE.MeshPhongMaterial({
    color: GEMS[color].hex, emissive: GEMS[color].hex, emissiveIntensity: 0.25,
    shininess: 120, specular: 0xffffff, flatShading: true,
  });
  const mesh = new THREE.Mesh(GEM_GEO, mat);
  mesh.scale.set(1, 1.3, 1);
  mesh.castShadow = true;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color: GEMS[color].hex, transparent: true, opacity: 0.6, depthWrite: false }));
  glow.scale.set(1.8, 1.4, 1);
  mesh.add(glow);
  const restY = spot.userData.height + 0.55;
  mesh.position.set(0, spot.userData.height * 0.5, 0.05);
  mesh.visible = false;
  root.add(mesh);
  world.add(root);

  const label = document.createElement("div");
  label.className = "label";
  label.style.opacity = "0";
  label.innerHTML = `<div class="word"></div><div class="timer"><i></i></div>`;
  labelsEl.appendChild(label);

  const gem = { word, color, typed: 0, root, spot, mesh, mat, label, restY, state: "waiting", t: 0, wiggle: 0, phase: rand(0, 6) };
  game.gems.push(gem);
  renderWord(gem);
}

function renderWord(gem) {
  gem.label.querySelector(".word").innerHTML = gem.word.split("").map((ch, i) =>
    `<span class="${i < gem.typed ? "done" : i === gem.typed && game.target === gem ? "next" : ""}">${ch}</span>`).join("");
  gem.label.classList.toggle("target", game.target === gem);
}

function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function updateGems(dt) {
  for (const gem of [...game.gems]) {
    gem.root.position.x -= worldSpeed * dt;
    gem.t += dt;
    const m = gem.mesh;

    if (gem.state === "waiting" && gem.root.position.x <= REVEAL_X) {
      gem.state = "rising";
      gem.t = 0;
      m.visible = true;
      gem.label.style.opacity = "1";
      gem.spot.userData.rustle = 0.5;
    }
    if (gem.state === "rising") {
      const k = Math.min(gem.t / 0.6, 1);
      m.position.y = THREE.MathUtils.lerp(gem.spot.userData.height * 0.5, gem.restY, easeOutBack(k));
      m.scale.set(0.3 + 0.7 * k, (0.3 + 0.7 * k) * 1.3, 0.3 + 0.7 * k);
      if (k >= 1) { gem.state = "active"; sparkleAt(m, GEMS[gem.color].hex, 6); }
    }
    if (gem.state === "active") {
      m.position.y = gem.restY + Math.sin(clock * 2.5 + gem.phase) * 0.08;
      if (gem.root.position.x <= MISS_X) missGem(gem);
    }
    if (gem.state === "rising" || gem.state === "active") {
      m.rotation.y += dt * 1.6;
      gem.mat.emissiveIntensity = 0.25 + 0.5 * (gem.typed / gem.word.length) + 0.08 * Math.sin(clock * 5 + gem.phase);
      const prog = THREE.MathUtils.clamp((REVEAL_X - gem.root.position.x) / (REVEAL_X - MISS_X), 0, 1);
      const bar = gem.label.querySelector(".timer i");
      bar.style.transform = `scaleX(${1 - prog})`;
      bar.style.background = prog > 0.75 ? "#ffb36b" : "";
    }
    if (gem.state === "miss") {
      const k = Math.min(gem.t / 0.5, 1);
      m.position.y = THREE.MathUtils.lerp(gem.restY, gem.spot.userData.height * 0.4, k);
      m.scale.setScalar(1 - 0.8 * k);
      if (k >= 1) m.visible = false;
    }
    if (gem.state === "collect") {
      // swoop from the hiding spot into the fairy's wand
      const k = Math.min(gem.t / 0.5, 1);
      fairy.userData.wandTip.getWorldPosition(tmpV);
      m.position.lerpVectors(gem.from, tmpV, k * k);
      m.position.y += Math.sin(k * Math.PI) * 1.2;
      m.scale.setScalar(1 - 0.7 * k);
      m.rotation.y += dt * 12;
      if (k >= 1) {
        scene.remove(m);
        burst(tmpV, [GEMS[gem.color].hex, 0xffffff, 0xffe27a], 22, 3.5);
        gem.state = "done";
      }
    }
    if (gem.wiggle > 0) {
      gem.wiggle -= dt;
      m.rotation.z = Math.sin(gem.wiggle * 40) * 0.35 * (gem.wiggle / 0.4);
    } else if (gem.state !== "collect") m.rotation.z = 0;

    // hiding spot sprouts up, then rustles when its gem pops in or out
    if (gem.spot.userData.grow < 1) {
      gem.spot.userData.grow = Math.min(1, gem.spot.userData.grow + dt * 2.5);
      gem.spot.scale.setScalar(Math.max(0.01, easeOutBack(gem.spot.userData.grow)));
    } else if (gem.spot.userData.rustle > 0) {
      gem.spot.userData.rustle -= dt;
      const r = gem.spot.userData.rustle;
      gem.spot.scale.set(1 + Math.sin(r * 30) * 0.08 * r * 2, 1 - Math.sin(r * 30) * 0.08 * r * 2, 1);
    }

    if (gem.root.position.x < -WORLD_HALF) {
      world.remove(gem.root);
      gem.label.remove();
      game.gems.splice(game.gems.indexOf(gem), 1);
    }
  }
}

function sparkleAt(obj, color, n) {
  obj.getWorldPosition(tmpV2);
  for (let i = 0; i < n; i++) {
    emit({
      pos: tmpV2.clone().add(new THREE.Vector3(rand(-0.5, 0.5), rand(-0.4, 0.6), rand(-0.3, 0.3))),
      vel: new THREE.Vector3(rand(-0.4, 0.4), rand(0.4, 1.2), 0),
      color: pick([color, 0xffffff]), size: rand(0.2, 0.35), life: rand(0.5, 0.9),
    });
  }
}

function missGem(gem, counted = true) {
  gem.state = "miss";
  gem.t = 0;
  gem.spot.userData.rustle = 0.5;
  gem.label.style.opacity = "0";
  if (game.target === gem) game.target = null;
  if (!counted) return;
  game.missed++;
  game.pending.push(0.6);
}

function collectGem(gem) {
  gem.state = "collect";
  gem.t = 0;
  gem.from = gem.mesh.getWorldPosition(new THREE.Vector3());
  scene.attach(gem.mesh);
  gem.mesh.position.copy(gem.from);
  gem.label.style.opacity = "0";
  gem.spot.userData.rustle = 0.4;
  game.target = null;
  liveGems().forEach(renderWord);

  sfx.collect();
  say(gem.word);
  fairyAnim.spin = 1;
  game.collected++;
  save.totalGems++;

  const size = game.level.bagSize;
  const ch = game.level.challenge;
  if (game.bag.length < size) game.bag.push(gem.color);
  else if (ch && gem.color === ch.color) {
    // bag is full: swap out a gem that isn't the colour we're hunting for
    const i = game.bag.findIndex(c => c !== ch.color);
    if (i >= 0) game.bag[i] = gem.color;
  }
  setTimeout(() => { renderBag(); renderChallenge(); }, 450);

  if (Math.random() < REWARD_CHANCE) setTimeout(() => newFriend(gem.from), 650);
  persist();

  if (levelDone()) {
    mode = "celebrate";
    showKeyboard(false);
    for (const g of liveGems()) missGem(g, false);   // leftovers just hide again, no penalty
    setTimeout(celebrate, 700);
  } else {
    game.pending.push(0.7);
  }
}

function levelDone() {
  const ch = game.level.challenge;
  return game.bag.length >= game.level.bagSize &&
         (!ch || game.bag.filter(c => c === ch.color).length >= ch.count);
}

function renderBag() {
  const size = game.level.bagSize;
  let html = "🎒";
  for (let i = 0; i < size; i++) {
    html += `<div class="slot">${game.bag[i] ? gemIcon(game.bag[i]) : ""}</div>`;
  }
  $("bag").innerHTML = html;
}

function renderChallenge() {
  const ch = game.level.challenge;
  const pill = $("challengePill");
  pill.style.display = ch ? "" : "none";
  if (!ch) return;
  const have = Math.min(game.bag.filter(c => c === ch.color).length, ch.count);
  pill.innerHTML = `${GEMS[ch.color].emoji} ${ch.color} gems ${have} / ${ch.count}`;
  pill.classList.toggle("done", have >= ch.count);
}

/* ------------------------------ typing ------------------------------ */

function handleLetter(letter) {
  if (mode !== "play" || paused) return;
  const live = liveGems().filter(g => g.state !== "waiting");
  if (game.target && !live.includes(game.target)) game.target = null;

  if (!game.target) {
    // first letter chooses a gem — the one closest to the fairy wins ties
    const match = live.filter(g => g.word[0] === letter).sort((a, b) => a.root.position.x - b.root.position.x)[0];
    if (!match) {
      sfx.wrong();
      live.forEach(wiggle);
      return;
    }
    game.target = match;
  }
  const gem = game.target;
  if (gem.word[gem.typed] === letter) {
    gem.typed++;
    sfx.key();
    zap(gem);
    if (gem.typed === gem.word.length) collectGem(gem);
    else live.forEach(renderWord);
  } else {
    sfx.wrong();
    wiggle(gem);       // no progress lost — just a gentle nudge
  }
}

function releaseTarget() {
  if (!game.target) return;
  game.target.typed = 0;
  game.target = null;
  liveGems().forEach(renderWord);
}

function wiggle(gem) {
  gem.wiggle = 0.4;
  gem.label.classList.remove("wiggle");
  void gem.label.offsetWidth;
  gem.label.classList.add("wiggle");
}

// a little trail of stars from the wand to the gem on every right letter
function zap(gem) {
  fairy.userData.wandTip.getWorldPosition(tmpV);
  gem.mesh.getWorldPosition(tmpV2);
  for (let i = 0; i < 6; i++) {
    const p = tmpV.clone().lerp(tmpV2, i / 6);
    p.y += Math.sin((i / 6) * Math.PI) * 0.6;
    emit({ pos: p, vel: new THREE.Vector3(0, rand(0.2, 0.6), 0), color: pick([0xffe27a, GEMS[gem.color].hex]), size: 0.28, life: 0.35 + i * 0.04 });
  }
  sparkleAt(gem.mesh, GEMS[gem.color].hex, 3);
}

window.addEventListener("keydown", (e) => {
  startMusic();
  if (e.key === "Escape") { togglePause(); return; }
  if (e.key === "Backspace") { releaseTarget(); e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1 && /[a-z]/i.test(e.key)) handleLetter(e.key.toLowerCase());
});

/* ------------------------------ friends ----------------------------- */

const crew = [];             // animal meshes following the fairy
const CREW_VISIBLE = 10;

function newFriend(fromPos) {
  const kind = pick(ANIMAL_KINDS);
  const isNew = !save.crew[kind];
  save.crew[kind] = (save.crew[kind] || 0) + 1;
  game.newFriends.push(kind);
  persist();
  sfx.reward();
  const a = ANIMALS[kind];
  toast(`${a.emoji} ${isNew ? "A new friend!" : "Another"} ${a.name} joined your crew!`);
  say(`A ${a.name.toLowerCase()} joined your crew!`);
  const mesh = addCrewMember(kind);
  mesh.position.set(fromPos.x, 0, fromPos.z);
  burst(new THREE.Vector3(fromPos.x, 0.8, fromPos.z), [0xff9ccf, 0xffffff, 0xffd166], 14, 2.5);
  for (let i = 0; i < 5; i++) {
    emit({ pos: new THREE.Vector3(fromPos.x + rand(-0.4, 0.4), 1.2, fromPos.z), vel: new THREE.Vector3(0, rand(0.8, 1.4), 0),
           color: 0xff8fc8, size: 0.35, life: 1.2, tex: heartTex });
  }
  layoutCrew();
}

function addCrewMember(kind) {
  const m = buildAnimal(kind);
  m.userData.phase = rand(0, 6);
  m.userData.target = new THREE.Vector3();
  scene.add(m);
  crew.push(m);
  if (crew.length > CREW_VISIBLE) {
    const old = crew.shift();
    scene.remove(old);
  }
  return m;
}

function seedCrew() {
  // bring back a few friends from earlier play sessions
  const owned = [];
  for (const [kind, n] of Object.entries(save.crew)) for (let i = 0; i < Math.min(n, 3); i++) owned.push(kind);
  owned.sort(() => Math.random() - 0.5).slice(0, 6).forEach(k => {
    const m = addCrewMember(k);
    m.position.set(-12, 0, 3);
  });
  layoutCrew();
}

function layoutCrew() {
  // two cosy rows hopping along beneath and behind the fairy
  crew.forEach((m, i) => {
    const idx = crew.length - 1 - i;
    m.userData.target.set(FAIRY_X + 0.9 - Math.floor(idx / 2) * 1.05, 0, idx % 2 ? 3.4 : 2.3);
    m.visible = mode !== "crew";
  });
}

function updateCrew(dt) {
  const walking = worldSpeed > 0.1 || mode === "title";
  for (const m of crew) {
    m.position.x += (m.userData.target.x - m.position.x) * Math.min(1, dt * 2.5);
    m.position.z += (m.userData.target.z - m.position.z) * Math.min(1, dt * 2.5);
    const hop = Math.abs(Math.sin(clock * 6 + m.userData.phase));
    m.position.y = walking || mode === "celebrate" ? hop * (mode === "celebrate" ? 0.45 : 0.18) : 0;
    m.rotation.y = mode === "celebrate" ? Math.sin(clock * 3 + m.userData.phase) * 0.6 : 0.85;
  }
}

/* ---------------------------- crew showcase ------------------------- */

let showcase = [];
function openCrew() {
  mode = "crew";
  showOverlay(null);
  $("crewBar").classList.add("active");
  layoutCrew();
  const total = Object.values(save.crew).reduce((a, b) => a + b, 0);
  const found = ANIMAL_KINDS.filter(k => save.crew[k]).length;
  $("crewTitle").textContent = `My Crew · ${found}/${ANIMAL_KINDS.length} kinds · ${total} friends`;
  ANIMAL_KINDS.forEach((kind, i) => {
    const owned = save.crew[kind] > 0;
    const m = buildAnimal(kind, !owned);
    const col = i % 4, row = Math.floor(i / 4);
    m.position.set((col - 1.5) * 2.4 + (row ? 1.2 : 0) - 0.6, 0, row ? 2.2 : -0.4);
    m.scale.setScalar(1.35);
    m.userData.phase = rand(0, 6);
    m.userData.owned = owned;
    scene.add(m);
    const el = document.createElement("div");
    el.className = "label";
    el.innerHTML = owned
      ? `<div class="crew-label">${ANIMALS[kind].emoji} ${ANIMALS[kind].name} ×${save.crew[kind]}</div>`
      : `<div class="crew-label unknown">? ? ?</div>`;
    labelsEl.appendChild(el);
    showcase.push({ m, el });
  });
  if (!total) hint("Catch gems to meet woodland friends! 🌿", 5000);
}
function clearCrewShowcase() {
  for (const { m, el } of showcase) { scene.remove(m); el.remove(); }
  showcase = [];
}

/* ------------------------------ celebrate --------------------------- */

function celebrate() {
  sfx.complete();
  say("Hooray! Your bag is full!");
  fairyAnim.celebrate = 0.001;
  for (let i = 0; i < 4; i++) {
    setTimeout(() => burst(new THREE.Vector3(rand(-5, 5), rand(3, 5), rand(-2, 1)),
      [0xff8fc8, 0x6fc8ff, 0xffc93c, 0x5fdc96, 0xb48cff, 0xffffff], 30, 5), i * 300);
  }
  const n = game.levelNum;
  const stars = game.missed === 0 ? 3 : game.missed <= 3 ? 2 : 1;
  save.stars[n] = Math.max(save.stars[n] || 0, stars);
  save.unlocked = Math.max(save.unlocked, Math.min(n + 1, LEVELS.length));
  persist();

  setTimeout(() => {
    if (mode !== "celebrate") return;
    const titles = ["Bag full! 🎒", "Sparkly work! ✨", "Wonderful! 🌈", "Hooray! 🎉"];
    $("completeTitle").textContent = n === LEVELS.length ? "You finished every level! 👑" : pick(titles);
    $("completeStars").innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? "" : "dim"}">⭐</span>`).join("");
    $("completeStats").innerHTML =
      `💎 Gems caught: <b>${game.collected}</b><br>` +
      `🍃 Gems that hid again: <b>${game.missed}</b>` +
      (game.level.challenge ? `<br>${GEMS[game.level.challenge.color].emoji} ${game.level.challenge.color} gems: <b>done!</b>` : "");
    $("completeFriends").innerHTML = game.newFriends.length
      ? `New friends: ${game.newFriends.map(k => `<span class="emo">${ANIMALS[k].emoji}</span>`).join(" ")}`
      : "";
    $("nextBtn").style.display = n < LEVELS.length ? "" : "none";
    showOverlay("completeScreen");
  }, 2200);
}

/* ============================== fairy anim ========================== */

const fairyTrail = { t: 0 };
function updateFairy(dt) {
  const u = fairy.userData;
  const base = fairyAnim.base;
  let x = base.x, y = base.y + Math.sin(clock * 2.2) * 0.15, z = base.z;
  let turn = 0.9;

  if (mode === "crew") { x = 0; y = 3.2 + Math.sin(clock * 2.2) * 0.15; z = -2.4; turn = 0; }
  if (mode === "play" && game.target) {
    // lean toward the gem being spelled
    const tx = game.target.root.position.x;
    turn = THREE.MathUtils.clamp(Math.atan2(tx - x, game.target.root.position.z - z), 0.2, 1.6);
  }
  if (fairyAnim.celebrate > 0) {
    fairyAnim.celebrate += dt;
    const k = fairyAnim.celebrate;
    x += Math.sin(k * 3) * 1.5;
    y += Math.abs(Math.sin(k * 3)) * 1.2;
    turn = k * 6;
  }
  fairy.position.x += (x - fairy.position.x) * Math.min(1, dt * 4);
  fairy.position.y += (y - fairy.position.y) * Math.min(1, dt * 4);
  fairy.position.z += (z - fairy.position.z) * Math.min(1, dt * 4);
  fairyAnim.turn += (turn - fairyAnim.turn) * Math.min(1, dt * 6);

  if (fairyAnim.spin > 0) fairyAnim.spin = Math.max(0, fairyAnim.spin - dt * 1.8);
  fairy.rotation.y = fairyAnim.turn + (1 - fairyAnim.spin) * (fairyAnim.spin > 0 ? Math.PI * 2 : 0);
  u.body.rotation.z = Math.sin(clock * 1.7) * 0.06;
  u.head.rotation.z = Math.sin(clock * 1.3) * 0.1;
  u.arm.rotation.z = Math.sin(clock * 3) * 0.15 + (game.target && mode === "play" ? -0.5 : 0);
  u.star.rotation.z += dt * 2;
  for (const w of u.wings) {
    const s = w.userData.side;
    w.rotation.y = s * (0.5 + Math.sin(clock * 16) * 0.5);
    w.rotation.x = 0.2;
  }

  // sparkly trail
  fairyTrail.t -= dt;
  if (fairyTrail.t <= 0) {
    fairyTrail.t = 0.07;
    u.wandTip.getWorldPosition(tmpV);
    emit({
      pos: tmpV.clone().add(new THREE.Vector3(rand(-0.1, 0.1), rand(-0.1, 0.1), 0)),
      vel: new THREE.Vector3(-worldSpeed * 0.9 - 0.3, rand(-0.3, 0.1), rand(-0.2, 0.2)),
      color: pick([0xffe27a, 0xffffff, 0xffb3dc, 0xb9e5ff]), size: rand(0.15, 0.3), life: rand(0.6, 1.0),
    });
  }
}

/* =============================== loop =============================== */

function update(dt) {
  clock += dt;
  let target = 0;
  if (mode === "title") target = 1.2;
  else if (mode === "play") target = game.level.speed * (game.target ? 0.6 : 1);  // the forest waits a little while you spell
  worldSpeed += (target - worldSpeed) * Math.min(1, dt * 3);

  for (const s of scenery) {
    s.position.x -= worldSpeed * dt;
    if (s.position.x < -WORLD_HALF) s.position.x += WORLD_HALF * 2;
  }
  for (const c of clouds) {
    c.position.x -= (c.userData.speed + worldSpeed * 0.05) * dt;
    if (c.position.x < -45) c.position.x = 45;
  }
  if (sceneryExtras.sun) sceneryExtras.sun.rotation.z = Math.sin(clock * 0.8) * 0.06;

  if (mode === "play" || mode === "celebrate") {
    for (let i = game.pending.length - 1; i >= 0; i--) {
      game.pending[i] -= dt;
      if (game.pending[i] <= 0) {
        game.pending.splice(i, 1);
        if (mode === "play" && liveGems().length < game.level.maxOnScreen) spawnGem();
      }
    }
  }
  updateGems(dt);
  updateFairy(dt);
  updateCrew(dt);

  for (const { m } of showcase) {
    m.position.y = m.userData.owned ? Math.abs(Math.sin(clock * 3 + m.userData.phase)) * 0.25 : 0;
    m.rotation.y = Math.sin(clock * 1.2 + m.userData.phase) * 0.4;
  }

  // drifting pollen
  if (Math.random() < dt * 6) {
    emit({ pos: new THREE.Vector3(rand(-10, 12), rand(0.5, 4), rand(-4, 3)), vel: new THREE.Vector3(-worldSpeed * 0.6 - 0.2, rand(0.05, 0.3), 0),
           color: pick([0xffffff, 0xfff0a8, 0xffd6ec]), size: rand(0.08, 0.16), life: rand(2, 4), tex: dotTex });
  }
  updateParticles(dt);
}

function project(obj, offsetY, el, below = false) {
  obj.getWorldPosition(tmpV);
  tmpV.y += offsetY;
  tmpV.project(camera);
  if (tmpV.z > 1) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "";
  const x = (tmpV.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-tmpV.y * 0.5 + 0.5) * window.innerHeight;
  el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, ${below ? "10%" : "-100%"})`;
}

function updateLabels() {
  for (const gem of game.gems) {
    if (gem.state === "rising" || gem.state === "active" || gem.state === "miss") project(gem.mesh, 0.75, gem.label);
  }
  for (const { m, el } of showcase) project(m, 0, el, true);
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (!paused) update(dt);
  renderer.render(scene, camera);
  updateLabels();
}

/* ============================ resize/camera ========================= */

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole fairy-to-gem stretch visible, even on narrow screens
  const halfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = THREE.MathUtils.clamp(8.2 / (halfTan * camera.aspect), 12, 34);
  camera.position.set(0, 2.6 + dist * 0.16, dist);
  camera.lookAt(lookTarget);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

/* ============================== pause =============================== */

function togglePause() {
  if (mode !== "play") return;
  paused = !paused;
  showOverlay(paused ? "pauseScreen" : null);
  showKeyboard(!paused);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && mode === "play" && !paused) togglePause();
});

/* ======================== on-screen keyboard ======================== */

const touchDevice = window.matchMedia("(pointer: coarse)").matches;
function buildKeyboard() {
  const kbd = $("kbd");
  for (const row of ["qwertyuiop", "asdfghjkl", "zxcvbnm"]) {
    const r = document.createElement("div");
    r.className = "row";
    for (const ch of row) {
      const b = document.createElement("button");
      b.textContent = ch;
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); startMusic(); handleLetter(ch); });
      r.appendChild(b);
    }
    kbd.appendChild(r);
  }
}
function showKeyboard(on) { $("kbd").classList.toggle("active", on && touchDevice); }

/* ============================== menus =============================== */

function renderLevelGrid() {
  const grid = $("levelGrid");
  grid.innerHTML = "";
  LEVELS.forEach((_, i) => {
    const n = i + 1;
    const b = document.createElement("button");
    const locked = n > save.unlocked;
    const stars = save.stars[n] || 0;
    b.className = locked ? "locked" : n % 3 === 1 ? "" : n % 3 === 2 ? "sky" : "mint";
    b.innerHTML = `${locked ? "🔒" : n}<span class="stars">${"⭐".repeat(stars)}</span>`;
    b.disabled = locked;
    b.addEventListener("click", () => startLevel(n));
    grid.appendChild(b);
  });
}

function setIcons() {
  $("muteBtn").textContent = save.muted ? "🔇" : "🔊";
  $("voiceBtn").classList.toggle("off", !save.speak);
}

$("playBtn").addEventListener("click", () => { startMusic(); startLevel(save.unlocked); });
$("levelsBtn").addEventListener("click", () => { renderLevelGrid(); showOverlay("levelScreen"); });
$("levelsBackBtn").addEventListener("click", () => showOverlay("titleScreen"));
$("crewBtn").addEventListener("click", openCrew);
$("crewBackBtn").addEventListener("click", goToMenu);
$("pauseBtn").addEventListener("click", togglePause);
$("resumeBtn").addEventListener("click", togglePause);
$("quitBtn").addEventListener("click", goToMenu);
$("menuBtn").addEventListener("click", goToMenu);
$("replayBtn").addEventListener("click", () => startLevel(game.levelNum));
$("nextBtn").addEventListener("click", () => startLevel(game.levelNum + 1));
$("muteBtn").addEventListener("click", () => {
  save.muted = !save.muted;
  persist();
  setIcons();
  if (save.muted) { music.pause(); window.speechSynthesis?.cancel(); } else playMusic();
});
$("voiceBtn").addEventListener("click", () => {
  save.speak = !save.speak;
  persist();
  setIcons();
  if (save.speak) say("I'll say each word!");
});
window.addEventListener("pointerdown", startMusic);
// keep buttons from stealing keyboard focus (space/enter would click them while typing)
document.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });

/* =============================== start ============================== */

buildScenery();
buildClouds();
buildKeyboard();
seedCrew();
setIcons();
resize();
requestAnimationFrame(frame);
window.__gemFairyReady = true;
$("loading").remove();
</script>
</body>
