<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Fairy — Spelling Game</title>
<style>
  :root {
    --sky-top: #bfe3d8;
    --sky-bottom: #f4eecf;
    --canopy-far: #aacfa0;
    --canopy-near: #7db877;
    --trunk: #8a6a4f;
    --floor: #8fc183;
    --ink: #5b4a68;
    --accent: #b487c8;
    --gold: #f0c75e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    user-select: none;
  }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .screen.active { display: flex; }

  /* ---------- shared background scenery ---------- */
  .scenery { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .sun {
    position: absolute; top: 6%; right: 10%;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, #fff3c4, #ffe08a 60%, transparent 70%);
  }
  .cloud {
    position: absolute; height: 28px; border-radius: 20px;
    background: rgba(255,255,255,.85);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content:""; position:absolute; background:inherit; border-radius:50%;
  }
  .cloud::before { width:34px; height:34px; top:-16px; left:12px; }
  .cloud::after  { width:24px; height:24px; top:-10px; right:14px; }
  @keyframes drift {
    from { transform: translateX(-160px); }
    to   { transform: translateX(calc(100vw + 160px)); }
  }
  .forest-layer {
    position: absolute; left: 0; bottom: 0; width: 260vw;
    transition: transform .8s ease;
  }
  .forest-layer.far  { height: 52%; opacity: .65; }
  .forest-layer.near { height: 62%; }
  .forest-layer .tree { position: absolute; bottom: 0; }
  .forest-layer .tree svg { display: block; width: 100%; height: 100%; }
  .ground {
    position: absolute; left: 0; bottom: 0; width: 260vw; height: 13%;
    background: linear-gradient(var(--floor), #6fa566);
    border-top: 4px solid rgba(255,255,255,.25);
    transition: transform .8s ease;
  }
  .ground .sprout { position: absolute; bottom: 55%; font-size: 20px; }
  .firefly {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #fff7c4; box-shadow: 0 0 10px 4px rgba(255,240,160,.8);
    animation: glow 3.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { opacity: .15; transform: translateY(0); }
    50%     { opacity: .9;  transform: translateY(-14px); }
  }

  /* ---------- title screen ---------- */
  h1.title {
    font-size: clamp(2.2rem, 6vw, 4rem);
    color: var(--accent);
    text-shadow: 0 3px 0 rgba(255,255,255,.8);
    margin-bottom: .4em;
    z-index: 1;
  }
  .subtitle { z-index: 1; margin-bottom: 2em; font-size: 1.1rem; }
  .menu-buttons { display: flex; flex-direction: column; gap: 14px; z-index: 1; }
  button.big {
    font-family: inherit; font-size: 1.3rem; color: var(--ink);
    padding: 14px 48px; border: none; border-radius: 30px;
    background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12);
    cursor: pointer; transition: transform .1s;
  }
  button.big:hover:not(:disabled) { transform: scale(1.05); }
  button.big:disabled { opacity: .45; cursor: default; }
  button.big.primary { background: var(--accent); color: #fff; }
  .level-row { display: flex; gap: 12px; justify-content: center; }
  .level-row button.big { padding: 14px 24px; }
  .best-note { font-size: .75rem; display: block; opacity: .7; }

  /* ---------- gameplay ---------- */
  #playArea { position: absolute; inset: 0; }
  .hud {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 28px;
    font-size: 1.05rem; z-index: 5;
  }
  .hud .pill {
    background: rgba(255,255,255,.85); border-radius: 20px;
    padding: 6px 18px; box-shadow: 0 2px 0 rgba(0,0,0,.08);
  }
  #challengePill { color: #2e7d4f; font-weight: bold; }
  #quitBtn {
    position: absolute; top: 12px; left: 12px; z-index: 6;
    font-family: inherit; border: none; border-radius: 16px;
    background: rgba(255,255,255,.8); padding: 6px 14px; cursor: pointer; color: var(--ink);
  }

  /* fairy */
  #fairy {
    position: absolute; width: 90px; height: 100px; z-index: 4;
    transition: left .6s ease;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -14px; } }
  .sparkle {
    position: absolute; width: 7px; height: 7px; border-radius: 50%; z-index: 6;
    background: #fff; box-shadow: 0 0 8px 3px rgba(255,230,150,.9);
    pointer-events: none; animation: sparkleFade .9s forwards;
  }
  @keyframes sparkleFade { to { opacity: 0; transform: translateY(18px) scale(.3); } }

  /* hideouts — permanent hiding spots scattered on the forest floor */
  .hideout {
    position: absolute; width: 100px; z-index: 3;
    transform: translateX(-50%); pointer-events: none;
  }
  .hideout svg { display: block; width: 100%; }
  .hideout.rustle { animation: rustle .5s; }
  @keyframes rustle {
    20% { transform: translateX(-50%) rotate(-4deg); }
    50% { transform: translateX(-50%) rotate(4deg); }
    80% { transform: translateX(-50%) rotate(-2deg); }
  }

  /* gems — pop up out of the hideouts, discovered by the fairy */
  .gem {
    position: absolute; width: 110px; margin-left: -55px;
    text-align: center; z-index: 2;
    transition: opacity .3s;
  }
  .gem .nest { position: relative; width: 110px; height: 104px; margin: 0 auto; }
  .gem svg.stone {
    width: 64px; height: 64px; display: block;
    position: absolute; left: 23px; bottom: 24px;
    transform: translateY(42px) scale(.4); opacity: 0;
    transition: transform .7s cubic-bezier(.34,1.45,.5,1), opacity .45s;
  }
  .gem.revealed svg.stone { transform: translateY(0) scale(1); opacity: 1; }
  .gem .word {
    margin-bottom: 2px; display: inline-block;
    background: rgba(255,255,255,.9); border-radius: 14px;
    padding: 4px 14px; font-size: 1.5rem; letter-spacing: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,.1);
    opacity: 0; transition: opacity .4s;
  }
  .gem.revealed .word { opacity: 1; }
  .gem .word .done { color: var(--accent); font-weight: bold; }
  .gem.target .word { outline: 3px solid var(--accent); }
  .gem.wiggle { animation: wiggle .3s; }
  @keyframes wiggle {
    25% { transform: translateX(-6px) rotate(-3deg); }
    75% { transform: translateX(6px) rotate(3deg); }
  }
  .gem.collected { transition: all .65s cubic-bezier(.5,-0.3,.7,1); opacity: .9; z-index: 7; }
  .gem.missed svg.stone { transform: translateY(42px) scale(.4); opacity: 0; }
  .gem.missed .word, .gem.missed .timer-ring { opacity: 0; }
  .gem.missed { transition: opacity .6s ease .7s; opacity: 0; }
  .timer-ring {
    position: absolute; top: 10px; left: 17px; width: 76px; height: 76px;
    z-index: 3; opacity: 0; transition: opacity .4s;
  }
  .gem.revealed .timer-ring { opacity: 1; }
  .timer-ring circle.track { fill: none; stroke: rgba(255,255,255,.6); stroke-width: 4; }
  .timer-ring circle.left  { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round;
                             transform: rotate(-90deg); transform-origin: center; }

  /* bag / progress */
  #bag {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 5;
    background: rgba(255,248,235,.92); border: 3px solid #d9b98c;
    border-radius: 22px; padding: 10px 18px;
  }
  #bag .slot {
    width: 26px; height: 26px; border-radius: 6px;
    background: rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center;
  }
  #bag .slot svg { width: 22px; height: 22px; }

  /* toasts / reward popup */
  #rewardToast {
    position: absolute; top: 24%; left: 50%; transform: translateX(-50%) scale(0);
    background: #fff; border-radius: 24px; padding: 18px 30px; z-index: 9;
    text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    transition: transform .35s cubic-bezier(.2,1.6,.4,1);
  }
  #rewardToast.show { transform: translateX(-50%) scale(1); }
  #rewardToast svg { width: 80px; height: 80px; }
  #rewardToast .msg { font-size: 1.15rem; margin-top: 6px; }

  /* ---------- overlays (level complete) ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(91,74,104,.35);
  }
  .overlay.active { display: flex; }
  .card {
    background: #fffdf7; border-radius: 28px; padding: 36px 48px;
    text-align: center; max-width: 480px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .card h2 { color: var(--accent); font-size: 2rem; margin-bottom: .5em; }
  .card .stats { font-size: 1.1rem; margin-bottom: 1em; line-height: 1.7; }
  .card .new-animals { margin-bottom: 1em; }
  .card .new-animals svg { width: 56px; height: 56px; margin: 0 4px; }
  .card .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---------- menagerie ---------- */
  #menagerieScreen .meadow {
    z-index: 1; background: rgba(255,255,255,.55); border-radius: 28px;
    padding: 28px 36px; max-width: 640px; width: 90%;
    max-height: 60vh; overflow-y: auto;
  }
  #menagerieGrid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  #menagerieGrid .pet { text-align: center; font-size: .8rem; }
  #menagerieGrid .pet svg { width: 64px; height: 64px; display: block; }
  .empty-note { opacity: .7; font-style: italic; }
</style>
</head>
<body>

<!-- shared scenery -->
<div class="scenery" id="scenery">
  <div class="sun"></div>
  <div class="cloud" style="top:12%; width:70px; animation-duration:55s;"></div>
  <div class="cloud" style="top:22%; width:90px; animation-duration:75s; animation-delay:-30s;"></div>
  <div class="cloud" style="top:8%;  width:60px; animation-duration:65s; animation-delay:-50s;"></div>
  <div class="forest-layer far" id="forestFar"></div>
  <div class="forest-layer near" id="forestNear"></div>
  <div class="ground" id="ground"></div>
  <div class="firefly" style="left:18%; top:48%; animation-delay:-1s;"></div>
  <div class="firefly" style="left:46%; top:40%; animation-delay:-2.2s;"></div>
  <div class="firefly" style="left:72%; top:52%;"></div>
  <div class="firefly" style="left:88%; top:38%; animation-delay:-1.6s;"></div>
</div>

<!-- title screen -->
<div class="screen active" id="titleScreen">
  <h1 class="title">✨ Gem Fairy ✨</h1>
  <p class="subtitle">Type the words to discover gems hidden in the forest!</p>
  <div class="menu-buttons">
    <button class="big primary" id="playBtn">Play</button>
    <div class="level-row" id="levelRow"></div>
    <button class="big" id="menagerieBtn">Menagerie 🦊</button>
  </div>
</div>

<!-- gameplay screen -->
<div class="screen" id="gameScreen">
  <div id="playArea"></div>
  <button id="quitBtn">← Menu</button>
  <div class="hud">
    <span class="pill" id="levelPill">Level 1</span>
    <span class="pill" id="gemPill">Gems 0 / 10</span>
    <span class="pill" id="challengePill" style="display:none;"></span>
  </div>
  <div id="bag"></div>
  <div id="rewardToast"></div>
</div>

<!-- level complete overlay -->
<div class="overlay" id="completeOverlay">
  <div class="card">
    <h2>Level Complete! 🎉</h2>
    <div class="stats" id="completeStats"></div>
    <div class="new-animals" id="completeAnimals"></div>
    <div class="buttons">
      <button class="big" id="replayBtn">Replay</button>
      <button class="big primary" id="nextBtn">Next level</button>
      <button class="big" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

<!-- menagerie screen -->
<div class="screen" id="menagerieScreen">
  <h1 class="title">Your Menagerie</h1>
  <div class="meadow">
    <div id="menagerieGrid"></div>
  </div>
  <p style="z-index:1; margin-top:18px;">
    <button class="big" id="menagerieBackBtn">← Back</button>
  </p>
</div>

<script>
"use strict";

/* ============================== config ============================== */

const LEVELS = [
  { // level 1 — gentle introduction
    words: ["at","it","in","an","sat","sit","pin","tap","sip","pat","nap","tip"],
    timePerGem: 12000, gemTarget: 10, maxOnScreen: 1, challenge: null,
  },
  { // level 2 — faster fairy, full SATPIN set
    words: ["sat","sit","pin","tap","sip","tip","pat","tan","nap","pit","pan","nip","tin","sap","ant","pip"],
    timePerGem: 9000, gemTarget: 10, maxOnScreen: 1, challenge: null,
  },
  { // level 3 — new letters (c k e h r m d) + green-gem challenge, two gems at once
    words: ["cat","hen","red","mat","hat","rat","ten","net","pet","map","cap","can","kid","sad","ram","mad","men","dip"],
    timePerGem: 8000, gemTarget: 10, maxOnScreen: 2,
    challenge: { color: "green", count: 4 },
  },
];

const GEM_COLORS = {
  pink:  { main: "#f48fb1", light: "#ffc1d9", dark: "#c2607f" },
  blue:  { main: "#7eb8e8", light: "#bcdcf7", dark: "#4f86b5" },
  gold:  { main: "#f0c75e", light: "#ffe6a3", dark: "#c19737" },
  green: { main: "#81c784", light: "#b9e5ba", dark: "#519455" },
};

const ANIMALS = ["fox","rabbit","hedgehog","owl","deer","squirrel"];
const ANIMAL_NAMES = {
  fox: "Fox", rabbit: "Rabbit", hedgehog: "Hedgehog",
  owl: "Owl", deer: "Deer", squirrel: "Squirrel",
};
const REWARD_CHANCE = 0.15;
const STORAGE_KEY = "gemFairySave";

/* ============================ svg sprites =========================== */

function gemSVG(color) {
  const c = GEM_COLORS[color];
  return `<svg class="stone" viewBox="0 0 64 64">
    <polygon points="32,4 56,24 32,60 8,24" fill="${c.main}" stroke="${c.dark}" stroke-width="2"/>
    <polygon points="32,4 44,24 32,60 20,24" fill="${c.light}" opacity=".7"/>
    <polygon points="8,24 56,24 44,32 20,32" fill="${c.dark}" opacity=".35"/>
    <circle cx="26" cy="16" r="3" fill="#fff" opacity=".9"/>
  </svg>`;
}

function roundTreeSVG(canopy, shade) {
  return `<svg viewBox="0 0 80 120" preserveAspectRatio="none">
    <rect x="34" y="68" width="12" height="52" rx="5" fill="#8a6a4f"/>
    <circle cx="40" cy="44" r="30" fill="${canopy}"/>
    <circle cx="20" cy="60" r="19" fill="${shade}"/>
    <circle cx="60" cy="60" r="19" fill="${shade}"/>
  </svg>`;
}
function pineTreeSVG(canopy, shade) {
  return `<svg viewBox="0 0 80 120" preserveAspectRatio="none">
    <rect x="35" y="92" width="10" height="28" rx="4" fill="#8a6a4f"/>
    <polygon points="40,4 64,46 16,46" fill="${canopy}"/>
    <polygon points="40,30 70,76 10,76" fill="${shade}"/>
    <polygon points="40,58 76,100 4,100" fill="${canopy}"/>
  </svg>`;
}

/* hiding spots the gems are tucked into */
const SPOT_SVGS = {
  bush: `<svg viewBox="0 0 100 46">
    <circle cx="24" cy="32" r="20" fill="#6fb474"/>
    <circle cx="50" cy="26" r="24" fill="#7dc282"/>

    <circle cx="64" cy="24" r="4" fill="#f0c75e"/>
  </svg>`,
  stump: `<svg viewBox="0 0 100 46">
    <rect x="26" y="14" width="48" height="28" rx="6" fill="#8a6a4f"/>
    <ellipse cx="50" cy="14" rx="24" ry="9" fill="#c9a87f"/>
    <ellipse cx="50" cy="14" rx="14" ry="5" fill="#b08d63"/>
    <path d="M12 42 Q16 26 22 42 M84 42 Q88 28 94 42" fill="#6fb474"/>
  </svg>`,
  ferns: `<svg viewBox="0 0 100 46">
    <path d="M20 46 Q14 18 4 14 M20 46 Q22 16 12 6 M20 46 Q30 20 36 16"
          stroke="#5e9c63" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M78 46 Q72 22 64 18 M78 46 Q82 18 90 8 M78 46 Q90 24 96 20"
          stroke="#6fb474" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="42" rx="22" ry="7" fill="#7dc282"/>
  </svg>`,

const SPOT_KINDS = Object.keys(SPOT_SVGS);

const ANIMAL_SVGS = {
  fox: `<svg viewBox="0 0 64 64">
    <polygon points="14,10 24,24 8,26" fill="#e8833a"/>
    <polygon points="50,10 40,24 56,26" fill="#e8833a"/>

    <circle cx="39" cy="33" r="3" fill="#3b2b20"/>
    <circle cx="32" cy="44" r="3" fill="#3b2b20"/>
  </svg>`,
  rabbit: `<svg viewBox="0 0 64 64">

    <ellipse cx="40" cy="14" rx="3" ry="9" fill="#e9c8d8"/>

    <circle cx="25" cy="35" r="3" fill="#3b2b20"/>
    <circle cx="39" cy="35" r="3" fill="#3b2b20"/>
    <ellipse cx="32" cy="44" rx="4" ry="3" fill="#e9a0b4"/>
  </svg>`,
  hedgehog: `<svg viewBox="0 0 64 64">
    <path d="M8 44 Q10 16 32 14 Q54 16 56 44 Z" fill="#8a6a4f"/>
    <polygon points="14,22 18,10 22,22" fill="#5d4534"/>
    <polygon points="26,18 30,6 34,18" fill="#5d4534"/>
    <polygon points="40,20 46,9 48,22" fill="#5d4534"/>
    <ellipse cx="32" cy="46" rx="22" ry="10" fill="#c9a87f"/>
    <circle cx="24" cy="42" r="2.5" fill="#3b2b20"/>
    <circle cx="40" cy="42" r="2.5" fill="#3b2b20"/>
    <circle cx="32" cy="48" r="3" fill="#3b2b20"/>
  </svg>`,
  owl: `<svg viewBox="0 0 64 64">
    <ellipse cx="32" cy="36" rx="20" ry="23" fill="#a98f6f"/>
    <polygon points="16,16 22,24 12,24" fill="#a98f6f"/>
    <polygon points="48,16 42,24 52,24" fill="#a98f6f"/>
    <circle cx="24" cy="30" r="8" fill="#fdf3e3"/>
    <circle cx="40" cy="30" r="8" fill="#fdf3e3"/>
    <circle cx="24" cy="30" r="3.5" fill="#3b2b20"/>
    <circle cx="40" cy="30" r="3.5" fill="#3b2b20"/>
    <polygon points="32,36 28,42 36,42" fill="#f0c75e"/>
    <ellipse cx="32" cy="50" rx="11" ry="8" fill="#c9b491"/>
  </svg>`,
  deer: `<svg viewBox="0 0 64 64">
    <path d="M18 16 Q12 6 8 8 M18 16 Q20 8 14 4" stroke="#8a6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M46 16 Q52 6 56 8 M46 16 Q44 8 50 4" stroke="#8a6a4f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="32" cy="38" rx="18" ry="20" fill="#c9a87f"/>
    <circle cx="25" cy="34" r="3" fill="#3b2b20"/>
    <circle cx="39" cy="34" r="3" fill="#3b2b20"/>
    <ellipse cx="32" cy="46" rx="5" ry="4" fill="#3b2b20"/>
    <circle cx="22" cy="44" r="2" fill="#fff" opacity=".8"/>
    <circle cx="42" cy="44" r="2" fill="#fff" opacity=".8"/>
  </svg>`,
  squirrel: `<svg viewBox="0 0 64 64">
    <path d="M44 50 Q62 44 56 24 Q52 8 40 14 Q48 22 44 34 Z" fill="#b06f3e"/>
    <circle cx="26" cy="38" r="17" fill="#c98a52"/>
    <polygon points="16,24 20,12 26,22" fill="#b06f3e"/>
    <circle cx="21" cy="35" r="3" fill="#3b2b20"/>
    <circle cx="33" cy="35" r="3" fill="#3b2b20"/>
    <circle cx="27" cy="44" r="3" fill="#3b2b20"/>
  </svg>`,
};

const FAIRY_SVG = `<svg viewBox="0 0 90 100">
  <ellipse cx="28" cy="42" rx="22" ry="14" fill="rgba(200,230,255,.7)" transform="rotate(-25 28 42)"/>
  <ellipse cx="62" cy="42" rx="22" ry="14" fill="rgba(200,230,255,.7)" transform="rotate(25 62 42)"/>
  <polygon points="45,42 28,84 62,84" fill="#b487c8"/>
  <circle cx="45" cy="30" r="13" fill="#ffd9b8"/>
  <path d="M32 28 Q34 12 45 14 Q58 12 58 28 Q52 20 45 21 Q38 20 32 28" fill="#8a5a3b"/>
  <circle cx="40" cy="30" r="2" fill="#3b2b20"/>
  <circle cx="50" cy="30" r="2" fill="#3b2b20"/>
  <path d="M41 36 Q45 39 49 36" stroke="#3b2b20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="62" y1="60" x2="78" y2="44" stroke="#8a5a3b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="42" r="5" fill="#ffe08a"/>
</svg>`;

/* ============================ persistence ============================ */

function loadSave() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* corrupted save — start fresh */ }
  return { highestUnlockedLevel: 1, bestResults: {}, menagerie: [], totalGems: 0 };
}
let save = loadSave();
function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); }

/* =============================== audio ============================== */

let audioCtx = null;
function tone(freq, dur, type = "sine", vol = 0.12, when = 0) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch (e) { /* audio unavailable — play silently */ }
}
const sfx = {
  key:      () => tone(880, .08, "sine", .06),
  wrong:    () => tone(180, .15, "triangle", .08),
  collect:  () => { tone(660, .12); tone(880, .12, "sine", .12, .09); tone(1100, .2, "sine", .12, .18); },
  reward:   () => { [880, 1100, 1320, 1760].forEach((f, i) => tone(f, .18, "sine", .1, i * .1)); },
  complete: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, "sine", .12, i * .15)); },
};

/* ============================ screen flow ============================ */

const $ = (id) => document.getElementById(id);
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

/* ============================== forest ============================== */

function buildForest() {
  const layers = [
    { el: $("forestFar"),  count: 16, minW: 70,  maxW: 120, colors: [["#aacfa0", "#98c290"], ["#a3c9ac", "#8fbd9a"]] },
    { el: $("forestNear"), count: 11, minW: 120, maxW: 190, colors: [["#7db877", "#6aa965"], ["#74b283", "#5fa06f"]] },
  ];
  for (const layer of layers) {
    layer.el.innerHTML = "";
    for (let i = 0; i < layer.count; i++) {
      const tree = document.createElement("div");
      tree.className = "tree";
      const w = layer.minW + Math.random() * (layer.maxW - layer.minW);
      const [canopy, shade] = layer.colors[Math.floor(Math.random() * layer.colors.length)];
      tree.style.width = w + "px";
      tree.style.height = (w * 1.45) + "px";
      tree.style.left = (i / layer.count * 250 + Math.random() * 8) + "vw";
      tree.innerHTML = Math.random() < 0.35 ? pineTreeSVG(canopy, shade) : roundTreeSVG(canopy, shade);
      layer.el.appendChild(tree);
    }
  }
  const ground = $("ground");
  ground.innerHTML = "";
  const sprouts = ["🌼", "🍄", "🌷", "🌿", "🌼", "🍄"];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("div");
    s.className = "sprout";
    s.style.left = (i / 26 * 250 + Math.random() * 6) + "vw";
    s.textContent = sprouts[Math.floor(Math.random() * sprouts.length)];
    ground.appendChild(s);
  }
}

function renderTitle() {
  const row = $("levelRow");
  row.innerHTML = "";
  LEVELS.forEach((_, i) => {
    const n = i + 1;
    const btn = document.createElement("button");
    btn.className = "big";
    const best = save.bestResults[n];
    btn.innerHTML = `Level ${n}` +
      (best ? `<span class="best-note">best: ${best.missed} missed</span>` : "");
    btn.disabled = n > save.highestUnlockedLevel;
    btn.addEventListener("click", () => startLevel(n));
    row.appendChild(btn);
  });
}

function renderMenagerie() {
  const grid = $("menagerieGrid");
  grid.innerHTML = "";
  if (save.menagerie.length === 0) {
    grid.innerHTML = `<p class="empty-note">No animals yet — collect gems and friends will find you! 🌿</p>`;
    return;
  }
  save.menagerie.forEach(kind => {
    const pet = document.createElement("div");
    pet.className = "pet";
    pet.innerHTML = `${ANIMAL_SVGS[kind]}<div>${ANIMAL_NAMES[kind]}</div>`;
    grid.appendChild(pet);
  });
}

/* ============================= game state ============================ */

const game = {
  running: false,
  levelNum: 1,
  level: null,
  collected: 0,
  missed: 0,
  greenCount: 0,
  gems: [],           // active gem objects
  hideouts: [],       // hiding spots scattered on the forest floor
  target: null,       // gem currently being typed
  newAnimals: [],     // animals earned this level
  nextGemId: 1,
  rafId: null,
  fairyStep: 0,
};

function startLevel(n) {
  game.levelNum = n;
  game.level = LEVELS[n - 1];
  game.collected = 0;
  game.missed = 0;
  game.greenCount = 0;
  game.gems = [];
  game.target = null;
  game.newAnimals = [];
  game.fairyStep = 0;
  game.running = true;

  $("playArea").innerHTML = "";
  $("rewardToast").className = "";
  $("completeOverlay").classList.remove("active");
  $("levelPill").textContent = `Level ${n}`;
  const ch = game.level.challenge;
  $("challengePill").style.display = ch ? "" : "none";
  if (ch) updateChallengePill();
  buildBag();
  updateHud();
  buildHideouts();
  placeFairy();
  showScreen("gameScreen");

  for (let i = 0; i < game.level.maxOnScreen; i++) spawnGem(i * 400);
  if (game.rafId) cancelAnimationFrame(game.rafId);
  game.rafId = requestAnimationFrame(tick);
}

function stopLevel() {
  game.running = false;
  if (game.rafId) cancelAnimationFrame(game.rafId);
  game.rafId = null;
}

/* ------------------------------ fairy ------------------------------ */

function placeFairy() {
  let fairy = $("fairy");
  if (!fairy) {
    fairy = document.createElement("div");
    fairy.id = "fairy";
    fairy.innerHTML = FAIRY_SVG;
    $("playArea").appendChild(fairy);
  }
  fairy.style.left = "6%";
  fairy.style.top = "22%";
  setInterval(() => {
    if (!game.running) return;
    const f = $("fairy");
    if (!f) return;
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = (f.offsetLeft + 10 + Math.random() * 30) + "px";
    s.style.top = (f.offsetTop + 50 + Math.random() * 30) + "px";
    $("playArea").appendChild(s);
    setTimeout(() => s.remove(), 900);
  }, 450);
}

function fairyStepForward() {
  // fairy nudges right a little each gem; the forest slides past in parallax
  game.fairyStep++;
  const fairy = $("fairy");
  const pct = 6 + Math.min(game.fairyStep, 10) * 1.5;
  fairy.style.left = pct + "%";
  $("forestFar").style.transform  = `translateX(${-game.fairyStep * 10}px)`;
  $("forestNear").style.transform = `translateX(${-game.fairyStep * 26}px)`;
  $("ground").style.transform     = `translateX(${-game.fairyStep * 34}px)`;
}

/* ------------------------------- gems ------------------------------- */

function pickWord() {
  const inUse = game.gems.map(g => g.word);
  const usedFirst = game.gems.map(g => g.word[0]);
  const pool = game.level.words.filter(w =>
    !inUse.includes(w) && !usedFirst.includes(w[0]) // distinct first letters for targeting
  );
  const list = pool.length ? pool : game.level.words.filter(w => !inUse.includes(w));
  return list[Math.floor(Math.random() * list.length)];
}

function pickColor() {
  const names = Object.keys(GEM_COLORS);
  const ch = game.level.challenge;
  if (ch && Math.random() < 0.4) return ch.color;
  return names[Math.floor(Math.random() * names.length)];
}

function buildHideouts() {
  game.hideouts = [];
  const count = Math.max(game.level.maxOnScreen + 3, 5);
  for (let i = 0; i < count; i++) {
    const leftPct = 14 + (i + 0.5) * (72 / count) + (Math.random() * 6 - 3);
    const bottomPct = 13 + Math.random() * 8;
    const kind = SPOT_KINDS[Math.floor(Math.random() * SPOT_KINDS.length)];
    const el = document.createElement("div");
    el.className = "hideout";
    el.style.left = leftPct + "%";
    el.style.bottom = bottomPct + "%";
    el.innerHTML = SPOT_SVGS[kind];
    $("playArea").appendChild(el);
    game.hideouts.push({ el, leftPct, bottomPct, occupied: false });
  }
}

function pickFreeHideout() {
  const free = game.hideouts.filter(h => !h.occupied);
  return free[Math.floor(Math.random() * free.length)] || null;
}

function spawnGem(delay = 0) {
  setTimeout(() => {
    if (!game.running) return;
    const hideout = pickFreeHideout();
    if (!hideout) { spawnGem(600); return; } // all spots busy — try again shortly
    hideout.occupied = true;
    const word = pickWord();
    const color = pickColor();
    const id = game.nextGemId++;

    const el = document.createElement("div");
    el.className = "gem";
    el.style.left = hideout.leftPct + "%";
    el.style.bottom = `calc(${hideout.bottomPct}% - 6px)`;
    const r = 36, circ = 2 * Math.PI * r;
    el.innerHTML = `
      <div class="word"></div>
      <div class="nest">
        <svg class="timer-ring" viewBox="0 0 76 76">
          <circle class="track" cx="38" cy="38" r="${r}"/>
          <circle class="left" cx="38" cy="38" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        </svg>
        ${gemSVG(color)}
      </div>`;
    $("playArea").appendChild(el);

    const gem = { id, word, color, typed: 0, el, hideout, revealed: false,
                  born: 0, life: game.level.timePerGem, ringCirc: circ };
    game.gems.push(gem);
    renderGemWord(gem);

    // a moment later the hiding spot rustles and the fairy discovers the gem
    setTimeout(() => {
      if (!game.running || !game.gems.includes(gem)) return;
      rustleSpot(gem);
      gem.el.classList.add("revealed");
      discoverySparkles(gem.el);
      gem.revealed = true;
      gem.born = performance.now();
    }, 550);
  }, delay);
}

function rustleSpot(gem) {
  const spot = gem.hideout.el;
  spot.classList.remove("rustle");
  void spot.offsetWidth; // restart animation
  spot.classList.add("rustle");
}

function discoverySparkles(gemEl) {
  for (let i = 0; i < 7; i++) {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = (gemEl.offsetLeft + 25 + Math.random() * 60) + "px";
    s.style.top = (gemEl.offsetTop + 10 + Math.random() * 70) + "px";
    s.style.animationDelay = (Math.random() * .25) + "s";
    $("playArea").appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}

function renderGemWord(gem) {
  const wordEl = gem.el.querySelector(".word");
  wordEl.innerHTML = gem.word.split("").map((ch, i) =>
    `<span class="${i < gem.typed ? "done" : ""}">${ch}</span>`).join("");
  gem.el.classList.toggle("target", game.target === gem);
}

function tick(now) {
  if (!game.running) return;
  for (const gem of [...game.gems]) {
    if (!gem.revealed) continue;
    const elapsed = now - gem.born;
    const frac = Math.min(elapsed / gem.life, 1);
    const ring = gem.el.querySelector("circle.left");
    if (ring) ring.style.strokeDashoffset = (gem.ringCirc * frac).toFixed(1);
    if (frac >= 1) missGem(gem);
  }
  game.rafId = requestAnimationFrame(tick);
}

function removeGem(gem) {
  game.gems = game.gems.filter(g => g !== gem);
  if (game.target === gem) game.target = null;
}

function missGem(gem) {
  removeGem(gem);
  // the gem slips back into its hiding spot
  rustleSpot(gem);
  gem.el.classList.remove("revealed");
  gem.el.classList.add("missed");
  setTimeout(() => { gem.el.remove(); gem.hideout.occupied = false; }, 1400);
  game.missed++;
  if (!levelGoalsMet()) spawnGem(700);
}

function collectGem(gem) {
  removeGem(gem);
  sfx.collect();
  game.collected++;
  if (gem.color === "green") game.greenCount++;
  save.totalGems++;

  // fly into the bag (the hideout stays behind, ready for the next gem)
  gem.hideout.occupied = false;
  const bagRect = $("bag").getBoundingClientRect();
  gem.el.classList.add("collected");
  gem.el.style.top = gem.el.offsetTop + "px";
  gem.el.style.bottom = "auto";
  void gem.el.offsetWidth; // settle position before the flight transition
  gem.el.style.left = (bagRect.left + bagRect.width / 2) + "px";
  gem.el.style.top = (bagRect.top - 30) + "px";
  gem.el.style.transform = "scale(.35)";
  gem.el.querySelector(".word").style.opacity = "0";
  setTimeout(() => gem.el.remove(), 700);

  fairyStepForward();
  fillBagSlot(game.collected, gem.color);
  updateHud();
  if (game.level.challenge) updateChallengePill();

  // chance of an animal friend
  if (Math.random() < REWARD_CHANCE) {
    const kind = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    game.newAnimals.push(kind);
    save.menagerie.push(kind);
    showRewardToast(kind);
    sfx.reward();
  }
  persist();

  if (levelGoalsMet()) {
    stopLevel();
    setTimeout(finishLevel, 1100);
  } else {
    spawnGem(500);
  }
}

function levelGoalsMet() {
  const ch = game.level.challenge;
  return game.collected >= game.level.gemTarget &&
         (!ch || game.greenCount >= ch.count);
}

/* ------------------------------ bag/hud ----------------------------- */

function buildBag() {
  const bag = $("bag");
  bag.innerHTML = "🎒";
  for (let i = 0; i < game.level.gemTarget; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.n = i + 1;
    bag.appendChild(slot);
  }
}

function fillBagSlot(n, color) {
  const slot = $("bag").querySelector(`.slot[data-n="${n}"]`);
  if (slot) slot.innerHTML = gemSVG(color);
}

function updateHud() {
  $("gemPill").textContent = `Gems ${game.collected} / ${game.level.gemTarget}`;
}

function updateChallengePill() {
  const ch = game.level.challenge;
  $("challengePill").textContent =
    `💚 Green gems ${Math.min(game.greenCount, ch.count)} / ${ch.count}`;
}

function showRewardToast(kind) {
  const toast = $("rewardToast");
  toast.innerHTML = `${ANIMAL_SVGS[kind]}<div class="msg">A ${ANIMAL_NAMES[kind].toLowerCase()} joined your crew!</div>`;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

/* --------------------------- level complete ------------------------- */

function finishLevel() {
  sfx.complete();
  const n = game.levelNum;
  // unlock next level and keep the best (fewest-missed) result
  save.highestUnlockedLevel = Math.max(save.highestUnlockedLevel, Math.min(n + 1, LEVELS.length));
  const prev = save.bestResults[n];
  if (!prev || game.missed < prev.missed) {
    save.bestResults[n] = { gems: game.collected, missed: game.missed };
  }
  persist();

  $("completeStats").innerHTML =
    `💎 Gems collected: <b>${game.collected}</b><br>` +
    `🍂 Gems that stayed hidden: <b>${game.missed}</b>` +
    (game.level.challenge ? `<br>💚 Green gems: <b>${game.greenCount}</b>` : "");
  $("completeAnimals").innerHTML = game.newAnimals.length
    ? `New friends! ${game.newAnimals.map(k => ANIMAL_SVGS[k]).join("")}`
    : "";
  $("nextBtn").style.display = n < LEVELS.length ? "" : "none";
  $("completeOverlay").classList.add("active");
}

/* ============================== typing ============================== */

window.addEventListener("keydown", (e) => {
  if (!game.running) return;
  if (e.key.length !== 1 || !/[a-z]/i.test(e.key)) return;
  const letter = e.key.toLowerCase();

  if (game.target) {
    tryLetter(game.target, letter);
    return;
  }
  // no target yet — first letter picks a gem
  const match = game.gems.find(g => g.revealed && g.word[0] === letter);
  if (match) {
    game.target = match;
    tryLetter(match, letter);
    game.gems.forEach(renderGemWord);
  } else {
    sfx.wrong();
    game.gems.forEach(g => wiggle(g));
  }
});

function tryLetter(gem, letter) {
  if (gem.word[gem.typed] === letter) {
    gem.typed++;
    sfx.key();
    renderGemWord(gem);
    if (gem.typed === gem.word.length) collectGem(gem);
  } else {
    sfx.wrong();
    wiggle(gem); // no progress lost — gentle nudge only
  }
}

function wiggle(gem) {
  gem.el.classList.remove("wiggle");
  void gem.el.offsetWidth; // restart animation
  gem.el.classList.add("wiggle");
}

/* ============================== wiring ============================== */

$("playBtn").addEventListener("click", () =>
  startLevel(Math.min(save.highestUnlockedLevel, LEVELS.length)));
$("menagerieBtn").addEventListener("click", () => {
  renderMenagerie();
  showScreen("menagerieScreen");
});
$("menagerieBackBtn").addEventListener("click", () => {
  renderTitle();
  showScreen("titleScreen");
});
$("quitBtn").addEventListener("click", () => {
  stopLevel();
  renderTitle();
  showScreen("titleScreen");
});
$("replayBtn").addEventListener("click", () => startLevel(game.levelNum));
$("nextBtn").addEventListener("click", () => startLevel(game.levelNum + 1));
$("menuBtn").addEventListener("click", () => {
  $("completeOverlay").classList.remove("active");
  renderTitle();
  showScreen("titleScreen");
});

buildForest();
renderTitle();
</script>
